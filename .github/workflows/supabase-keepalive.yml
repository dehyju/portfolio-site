name: Supabase keepalive

# Supabase pauses Free Plan projects after ~7 days with no activity.
# This pings the REST API twice a week so the project never crosses that threshold.
on:
  schedule:
    - cron: '0 0 * * 1,4' # 00:00 UTC every Monday and Thursday
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        run: |
          curl -sf \
            "${SUPABASE_URL}/rest/v1/blog_posts?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -o /dev/null
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
